; PlatformIO project configuration for ImudClient
;
; `pio test -e native` builds and runs test/test_parser/test_parser.cpp
; against ImudParser on the host — no hardware, no mocks (see README.md,
; "Testing"). This is the only environment meant for local `pio run`/`pio
; test` use: ImudClient.h is header-only with no .cpp providing setup()/
; loop(), so there is nothing else in this repo for a board environment to
; build on its own.
;
; The two example sketches (examples/TcpBasic, examples/UdpListen) are
; compiled against real boards in CI via `pio ci --lib="." --board=<id>`
; instead of as platformio.ini environments — PlatformIO environments can't
; point their src_dir at a folder outside src/, so per-example environments
; here would have nothing to build. See .github/workflows/ci.yml for the
; board matrix (esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, and
; best-effort d1_mini/rpipicow).
;
; Copyright (c) 2026 Richard Simpson
; SPDX-License-Identifier: MIT

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++14
    -Wall
    -Wextra

; Same suite under AddressSanitizer + UndefinedBehaviorSanitizer. CI runs
; this in addition to `native`, not instead of it: the sanitizers change
; codegen and timing, so a clean plain build is still worth having.
;
; IMUD_ASSERT turns ImudParser's internal index invariants into real traps.
; It is a no-op in every normal build (see src/ImudClient.h) — but it is
; load-bearing here, because ImudParser::buf_ is followed by padding, so a
; small overrun of it is an intra-object write that ASan alone cannot see.
[env:native-asan]
platform = native
test_framework = unity
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -Werror
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -DIMUD_ENABLE_ASSERTS
; PlatformIO links test binaries with the compiler driver, so the sanitizer
; runtime has to be requested at link time too.
link_flags =
    -fsanitize=address,undefined
