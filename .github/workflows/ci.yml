# CI for ImudClient
#
# job 1 (native-test): runs the ImudParser unit test suite on the host —
#   no hardware, no mocks (see README.md, "Testing").
# job 2 (compile-examples): compiles both example sketches against real
#   boards with `pio ci`. esp32dev / esp32-s3-devkitc-1 / esp32-c3-devkitm-1
#   are required; d1_mini (ESP8266) is best-effort (continue-on-error) since
#   the library only guarantees the Arduino Client/UDP interfaces, not every
#   third-party core's quirks. RP2040 (Pico W) is NOT covered here: as of
#   writing, PlatformIO's official registry has no Pico W board definition
#   to target (only the wireless-less "pico" and the WiFiNINA-based
#   "nanorp2040connect", neither of which represents the intended target) —
#   see CONTRIBUTING.md.
#
# Copyright (c) 2026 Richard Simpson
# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native tests
        run: pio test -e native

  compile-examples:
    name: Compile examples (${{ matrix.board }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32dev
            best_effort: false
          - board: esp32-s3-devkitc-1
            best_effort: false
          - board: esp32-c3-devkitm-1
            best_effort: false
          - board: d1_mini
            best_effort: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Compile TcpBasic
        run: pio ci examples/TcpBasic/TcpBasic.ino --lib="." --board=${{ matrix.board }}

      - name: Compile UdpListen
        run: pio ci examples/UdpListen/UdpListen.ino --lib="." --board=${{ matrix.board }}
