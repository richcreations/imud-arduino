name=ImudClient
version=1.1.0
author=Richard Simpson
maintainer=Richard Simpson
sentence=Receive attitude data from the imud IMU daemon over TCP or UDP.
paragraph=Decodes and validates imud's 276-byte binary packets (wire v17): heading, roll, pitch, quaternion, rate of turn, heave, sea state and filter gate health. Requires imud 1.7 or newer; use the 1.0.x line for imud 1.4-1.6. Works with any Arduino Client/UDP transport; ESP32 is the primary target.
category=Communication
url=https://github.com/richcreations/imud-arduino
architectures=*
includes=ImudClient.h
